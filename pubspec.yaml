name: reelmint
description: "Reelmint: a private, ad-free screen recorder for Android."
publish_to: 'none'

# versionName+versionCode on Android
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.14.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
